name: Versioning Workflow

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  # Plain semantic-release for the monorepo (Go): tags v* from the root
  # .releaserc.json, root CHANGELOG.md, GitHub release. No npm plugin here —
  # npm packages are released independently by client-release below.
  go-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Go release (tags, changelog, GitHub release)
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Multi-semantic-release for the npm workspaces. Runs after go-release so
  # the two flows never push tags/commits concurrently.
  client-release:
    needs: go-release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd client && bun ci

      - name: Build all packages
        run: cd client && bun run build

      - name: Release
        run: cd client && bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

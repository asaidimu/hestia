name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  lint:
    name: Lint & Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Codegen drift check
        run: |
          go run ./cmd/gen-routes
          if ! git diff --exit-code -- client/core/routes.gen.ts; then
            echo "::error::client/core/routes.gen.ts is stale. Run 'go run ./cmd/gen-routes' and commit."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test -v -count=1 ./...

  test-race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test (race)
        run: go test -race -count=1 ./core/...

  security:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache govulncheck
        id: cache-govulncheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-${{ runner.arch }}

      - name: Install govulncheck
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          # Fail only when our code actually calls vulnerable functions (symbol-level).
          # Module-level vulns in transitive deps we don't call are non-blocking.
          govulncheck -mode source ./...
          echo "--- Module-level advisory (non-blocking) ---"
          govulncheck ./... || true
